# ============================================
# REGLAS DE VENTANAS
# ============================================

# ----- WS 1 — Terminal principal -----
windowrule = match:class ^(Alacritty)$, match:title ^(homebase)$, workspace 1

# ----- WS 2 — Browser -----
windowrule = match:class ^(firefox)$, workspace 2 silent
windowrule = match:class ^(firefox)$, opacity 0.9

# ----- WS 3 — Editor -----
windowrule = match:class ^(kitty)$, match:title ^(nvim-ws)$, workspace 3 silent

# ----- WS 4 — Monitor -----
windowrule = match:class ^(kitty)$, match:title ^(btop-ws)$, workspace 4 silent
windowrule = match:class ^(kitty)$, match:title ^(btop-ws)$, opacity 0.85

# ----- WS 5 — VMs / Lab -----
windowrule = match:class ^(virt-manager)$, workspace 5 silent

# ----- WS 6 — Discord -----
windowrule = match:class ^(discord)$, workspace 6 silent
windowrule = match:class ^(discord)$, opacity 0.9

# ----- WS 7 — Claude Code -----
windowrule = match:class ^(kitty)$, match:title ^(claude-code)$, workspace 7 silent

# ----- Scratchpad -----
windowrule = match:class ^(scratchpad)$, workspace special:scratch silent
windowrule = match:class ^(scratchpad)$, float true
windowrule = match:class ^(scratchpad)$, size 900 520
windowrule = match:class ^(scratchpad)$, center true
windowrule = match:class ^(scratchpad)$, opacity 0.92

# ----- Dolphin -----
windowrule = match:class ^(dolphin)$, decorate false
