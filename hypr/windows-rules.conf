# ============================================
# REGLAS DE VENTANAS
# ============================================

# ----- Firefox workspace 1 -----
windowrule = match:class ^(firefox)$, workspace 1 silent
windowrule = match:class ^(firefox)$, opacity 0.9

# ----- Spotify workspace 2 -----
windowrule = match:class ^(spotify)$, workspace 2 silent

# ----- Discord workspace 3 -----
windowrule = match:class ^(discord)$, workspace 3 silent
windowrule = match:class ^(discord)$, opacity 0.9

# ----- Dolphin -----
windowrule = match:class ^(dolphin)$, decorate false

